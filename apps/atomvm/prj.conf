# Tang Primer 25K / LiteX additions to AtomVM's src/platforms/zephyr/prj.conf

# AtomVM allocates with malloc(); the C library's arena takes all SDRAM left after the image
# (32 MB board, COMMON_LIBC_MALLOC_ARENA_SIZE default -1).

# No crypto engine, no network, no power management on this SoC
CONFIG_AVM_ENABLE_CRYPTO=n
CONFIG_PM=n
CONFIG_TASK_WDT=n
CONFIG_I2C=n
CONFIG_I2C_TARGET=n

# AVM packs in SDRAM slots, filled by src/avm_loader.c (board.overlay)
CONFIG_AVM_LIB_ADDRESS=0x41800000
CONFIG_AVM_LIB_SIZE=0x400000
CONFIG_AVM_APP_ADDRESS=0x41e00000
CONFIG_AVM_APP_SIZE=0x200000

# -O2: also selects picolibc's speed-optimised string functions (memcpy 49 -> 13 cycles/word,
# memset 25 -> 4 on this SoC, apps/membench); GC copying is a large part of run time.
CONFIG_SPEED_OPTIMIZATIONS=y
# 1 ms resolution for erlang:monotonic_time and timers (default tick is 10 ms)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
